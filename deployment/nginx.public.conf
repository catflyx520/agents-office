user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $request_method $unsafe_method { default 1; GET 0; HEAD 0; OPTIONS 0; }
  map "$unsafe_method:$http_origin" $missing_origin { default 0; "1:" 1; }
  server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 32k;
    set $origin_allowed 0;
    if ($http_origin = "") { set $origin_allowed 1; }
    if ($http_origin = "https://$host") { set $origin_allowed 1; }
    if ($origin_allowed = 0) { return 403; }
    if ($missing_origin = 1) { return 403; }
    location = /upload {
      default_type application/json;
      return 410 '{"code":"UPLOADS_DISABLED","error":"Uploads are disabled to reduce running costs."}';
    }
    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
      add_header Cache-Control "no-store" always;
    }
  }
}
